[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["researchmind*"]

[project]
name = "researchmind"
version = "0.1.0"
description = "Compare naive, hybrid and agentic retrieval with cited research answers"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "python-multipart>=0.0.20",
    "pypdf>=5,<7",
    "fonttools>=4,<5",
    "qdrant-client>=1.12,<2",
    "rank-bm25>=0.2.2,<0.3",
    "langgraph>=1,<2",
    "pydantic-settings>=2.6,<3",
    "numpy>=1.26,<3",
    "snowballstemmer>=3,<4",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3,<6", "torch==2.7.1"]
eval = ["ragas>=0.3,<0.4", "langchain-openai>=0.3,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = [".uv-cache", ".python", "data", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
